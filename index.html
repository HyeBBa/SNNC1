  <title>SNNC 환원반 휴무계획표</title>

    body {
      font-family: 'Malgun Gothic', sans-serif;
      padding: 10px;
      background-color: #e9ecef;
      margin: 0;
      color: #333;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0 15px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }

    .btn-small {
      width: auto;
      padding: 6px 12px;
      font-size: 13px;
      margin: 0;
    }

    .cal-wrapper {
      overflow-x: auto;
      padding-bottom: 10px;
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      min-width: 950px;
      border-top: 2px solid #555;
      border-left: 1px solid #ccc;
      background: #fff;
    }

    .cal-header-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      min-width: 950px;
      text-align: center;
      font-weight: bold;
      background: #f8f9fa;
      border-left: 1px solid #ccc;
    }

    .cal-header-cell {
      padding: 8px 0;
      border-right: 1px solid #ccc;
      border-bottom: 1px solid #ccc;
      font-size: 14px;
    }

    .day-cell {
      border-right: 1px solid #ccc;
      border-bottom: 1px solid #ccc;
      display: flex;
      flex-direction: column;
    }

    .day-header-bar {
      display: flex;
      background: #f1f3f5;
      border-bottom: 1px solid #ddd;
      font-size: 12px;
      font-weight: bold;
      text-align: center;
    }

    .day-date-part {
      width: calc(45px + 100% - 45px);
      flex: 2;
      padding: 4px;
      border-right: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .day-sub-title {
      flex: 1;
      padding: 4px;
      color: #0056b3;
      background: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .holiday-name {
      font-size: 11px;
      font-weight: normal;
      margin-left: 3px;
      letter-spacing: -0.5px;
    }

    .team-row {
      display: flex;
      min-height: 35px;
      border-bottom: 1px solid #eee;
      font-size: 12px;
    }

    .memo-row {
      border-top: 1px solid #ccc;
      background-color: #fff9c4;
      border-bottom: none;
    }

    .my-team-row {
      background-color: #e6f2ff;
    }

    .cell-shift {
      width: 45px;
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      border-right: 1px solid #eee;
    }

    .cell-name {

      display: flex;
      justify-content: center;
      align-items: center;
      border-right: 1px solid #eee;
      color: #495057;
      position: relative;
    }

    }

    .off-request-cell {

    }

    }

    .clickable:hover {
      background-color: #f1f3f5;
    }

    .has-data {
      font-weight: bold;
      display: flex;
      flex-direction: column;
      align-items: center;

  const PATTERN = [

   */

   * 슈퍼관리자: 모든 조 휴무에 등록
   */
  function canRegisterSubstitution(targetTeam) {
    if (!currentUser || !currentUser.is_active) return false;
    if (currentUser.role === 'admin') return true;
    if (currentUser.role === 'team_admin') {
      return targetTeam === currentUser.team;
    }
    if (currentUser.role === 'user') {
      return targetTeam !== currentUser.team;
    }
    return false;
  }

  /*
   * ==========================================
   * 근무 계산
   * ==========================================
   */

  function getShiftInfo(
    team,
    dateObj
  ) {

    const targetDate =
      new Date(
        dateObj.getFullYear(),
        dateObj.getMonth(),
        dateObj.getDate()
      );

    const baseDate =
      new Date(
        BASE_DATE.getFullYear(),
        BASE_DATE.getMonth(),
        BASE_DATE.getDate()
      );

    const diffTime =
      targetDate - baseDate;

    const diffDays =
      Math.floor(
        diffTime /
        (1000 * 60 * 60 * 24)
      );

    let index =
      (
        diffDays +
        TEAM_OFFSET[team]
      ) % 8;

    if (index < 0) {
      index += 8;
    }

    return PATTERN[index];

  }


  /*
   * ==========================================
   * 추천 대근 조
   * ==========================================
   */

  function getSuggestedHelperTeam(
    targetTeam,
    shiftType,
    dateObj
  ) {

    const prevDate =
      new Date(dateObj);

    prevDate.setDate(
      dateObj.getDate() - 1
    );


    const nextDate =
      new Date(dateObj);

    nextDate.setDate(
      dateObj.getDate() + 1
    );


    let helperTeam = '';


    TEAMS.forEach(t => {

      if (t === targetTeam) {
        return;
      }


      const pShift =
        getShiftInfo(
          t,
          prevDate
        );


      const nShift =
        getShiftInfo(
          t,
          nextDate
        );


      if (
        shiftType === '주간'
      ) {

        if (
          pShift === '주간' ||
          nShift === '주간'
        ) {

          helperTeam =
            t + '조';

        }

      } else if (
        shiftType === '야간'
      ) {

        if (
          pShift === '야간' ||
          nShift === '야간'
        ) {

          helperTeam =
            t + '조';

        }

      }

    });


    return helperTeam;

  }

  async function login() {

    const code =
      document
        .getElementById('loginCode')
        .value
        .trim();


    if (!code) {

      alert(
        "코드를 입력하세요."
      );

      return;

    }


    const {
      data,
      error
    } =
      await supabaseClient
        .from('app_users')
        .select(
          'name, team, role, is_active'
        )
        .eq(
          'login_code',
          code
        )
        .maybeSingle();


    if (error) {

      alert(
        "로그인 조회 실패: " +
        error.message
      );

      return;

    }


    if (!data) {

      alert(
        "코드가 일치하지 않습니다."
      );

      return;

    }


    if (!data.is_active) {

      alert(
        "비활성화된 계정입니다."
      );

      return;

    }


    currentUser = {

      name:
        data.name,

      team:
        data.team,

      role:
        data.role,

      is_active:
        data.is_active

    };

    currentLoginCode = code;


    document
      .getElementById('loginScreen')
      .style.display = 'none';


    document
      .getElementById('mainScreen')
      .style.display = 'block';


    let roleBadge = '';


    if (
      currentUser.role === 'admin'

  async function logout() {

    try {

      /*
       * 공용 PC 대응
       * -----------------------------
       * user_id만으로 삭제하면 같은 직원의
       * 스마트폰 Push Subscription까지 삭제됩니다.
       *
       * 따라서 현재 브라우저의 endpoint와
       * 현재 로그인한 user_id를 함께 조건으로
       * 현재 기기의 구독만 삭제합니다.
       */

      let currentSubscription = null;

      try {

        const registration =
          await navigator.serviceWorker.ready;

        currentSubscription =
          await registration.pushManager.getSubscription();

      } catch (pushError) {

        console.warn(
          '현재 브라우저 Push Subscription 확인 실패:',
          pushError
        );

      }


      /*
       * 현재 브라우저의 Subscription만 DB에서 삭제
       */
      if (
        currentUser?.id &&
        currentSubscription
      ) {

        const endpoint =
          currentSubscription.endpoint;

        const { error } =
          await supabaseClient
            .from('push_subscriptions')
            .delete()
            .eq('user_id', currentUser.id)
            .filter(
              'subscription->>endpoint',
              'eq',
              endpoint
            );

        if (error) {

          console.error(
            '현재 브라우저 Push Subscription 삭제 실패:',
            error
          );

        } else {

          console.log(
            '현재 브라우저 Push Subscription 삭제 완료'
          );

        }

      }


      /*
       * 브라우저 자체의 Push Subscription 해제
       */
      if (currentSubscription) {

        try {

          await currentSubscription.unsubscribe();

          console.log(
            '현재 브라우저 Push Subscription 해제 완료'
          );

        } catch (unsubscribeError) {

          console.warn(
            'Push Subscription 해제 실패:',
            unsubscribeError
          );

        }

      }

    } catch (error) {

      console.error(
        '로그아웃 중 Push 처리 오류:',
        error
      );

    } finally {

      /*
       * 로그인 정보 초기화
       */
      currentUser = null;

      currentLoginCode = '';


      /*
       * 로그인 화면으로 이동
       */
      document
        .getElementById('loginCode')
        .value = '';

      document
        .getElementById('mainScreen')
        .style.display = 'none';

      document
        .getElementById('loginScreen')
        .style.display = 'block';

    }

  }

  async function changePersonalCode() {

    if (!currentUser || !currentLoginCode) {

        "※ 접속 코드는 월 2회까지만 변경할 수 있습니다."
      );


    if (newCode === null) {
      return;
    }


    const trimmedNewCode =
      newCode.trim();


    if (
      trimmedNewCode.length < 6 ||
      trimmedNewCode.length > 50
    ) {

      alert(
        "새 접속 코드는 6~50자로 입력해 주세요."
      );

      return;

    }


    const confirmCode =
      prompt(
        "새 접속 코드를 다시 입력하세요."
      );


    if (confirmCode === null) {
      return;
    }


    if (
      trimmedNewCode !==

    ) {

      alert(
        "새 접속 코드가 서로 일치하지 않습니다."
      );

      return;

    }


    const {
      data,
      error
    } =
      await supabaseClient
        .functions
        .invoke(
          'change-login-code',
          {
            body: {
              currentCode:
                currentLoginCode,

              newCode:
                trimmedNewCode
            }
          }
        );


    if (error) {

      alert(
        "코드 변경에 실패했습니다. 잠시 후 다시 시도해 주세요."
      );

      return;

    }


    if (!data || !data.success) {

      alert(
        data?.message ||
        "코드 변경에 실패했습니다."
      );

      return;

    }


    alert(

      "새 코드로 다시 로그인해 주세요."
    );

   */

  function goToMonth() {

    const selectedMonth =
      prompt(
        "이동할 년월을 입력하세요.\n" +
        "예: 2028-03",
        `${currentYear}-${String(currentMonth + 1).padStart(2, '0')}`
      );


    if (selectedMonth === null) {
      return;
    }


    const match =
      selectedMonth
        .trim()
        .match(
          /^(\d{4})\s*[-./년]\s*(\d{1,2})\s*월?$/
        );


    if (!match) {

      alert(
        "년월 형식을 확인해 주세요.\n" +
        "예: 2028-03"
      );

      return;

    }


    const year =
      Number(match[1]);

    const month =
      Number(match[2]);


    if (
      month < 1 ||
      month > 12
    ) {

      alert(
        "월은 1~12 사이로 입력해 주세요."
      );

      return;

    }


    currentYear = year;
    currentMonth = month - 1;

    loadData();

  }

  /*
   * ==========================================
   * 공휴일 자동 불러오기
   * ==========================================
   */

  function plusDays(dateStr, days) {

    const date = new Date(`${dateStr}T00:00:00Z`);

    date.setUTCDate(
      date.getUTCDate() + days
    );

    return date
      .toISOString()
      .slice(0, 10);

  }


  function getUtcDay(dateStr) {

    return new Date(
      `${dateStr}T00:00:00Z`
    ).getUTCDay();

  }


  function addPlannedHolidays(year) {

    const holidays = [];

    const addHoliday = (date, name, canSubstitute) => {

      holidays.push({
        date,
        name,
        canSubstitute
      });

    };


    [
      ['01-01', '신정', false],
      ['03-01', '3·1절', true],
      ['05-05', '어린이날', true],
      ['06-06', '현충일', false],
      ['08-15', '광복절', true],
      ['10-03', '개천절', true],
      ['10-09', '한글날', true],
      ['12-25', '성탄절', true]
    ].forEach(([monthDay, name, canSubstitute]) => {

      addHoliday(
        `${year}-${monthDay}`,
        name,
        canSubstitute
      );

    });


    const lunar =
      PLANNED_LUNAR_DATES[year];


    if (lunar) {

      [-1, 0, 1].forEach(offset => {

        const date = plusDays(
          lunar.newYear,
          offset
        );

        addHoliday(
          date,
          offset === 0 ? '설날' : '설연휴',
          true
        );

      });


      addHoliday(
        lunar.buddha,
        '부처님오신날',
        true
      );


      [-1, 0, 1].forEach(offset => {

        const date = plusDays(
          lunar.chuseok,
          offset
        );

        addHoliday(
          date,
          offset === 0 ? '추석' : '추석연휴',
          true
        );

      });

    }


    const dates = new Set(
      holidays.map(holiday => holiday.date)
    );

    const duplicateDates =
      holidays.reduce((counts, holiday) => {

        counts[holiday.date] =
          (counts[holiday.date] || 0) + 1;

        return counts;

      }, {});


    holidays.forEach(holiday => {

      HOLIDAYS[holiday.date] =
        HOLIDAYS[holiday.date] ||
        holiday.name;

    });


    holidays
      .filter(holiday => holiday.canSubstitute)
      .forEach(holiday => {

        if (
          getUtcDay(holiday.date) !== 0 &&
          duplicateDates[holiday.date] < 2
        ) {

          return;

        }


        let substituteDate =
          plusDays(holiday.date, 1);


        while (
          dates.has(substituteDate) ||
          getUtcDay(substituteDate) === 0
        ) {

          substituteDate = plusDays(
            substituteDate,
            1
          );

        }


        dates.add(substituteDate);

        HOLIDAYS[substituteDate] =
          '대체공휴일';

      });

  }

  async function loadHolidaysForYear(year) {

    if (
      loadedHolidayYears.has(year)
    ) {

      return;

    }


    const {
      data,
      error
    } =
      await supabaseClient
        .functions
        .invoke(
          'get-holidays',
          {
            body: {
              year: year
            }
          }
        );


    if (
      !error &&
      data &&
      data.success &&
      Array.isArray(data.holidays) &&
      data.holidays.length > 0
    ) {

      data.holidays.forEach(holiday => {

        if (
          holiday.date &&
          holiday.name
        ) {

          HOLIDAYS[holiday.date] =
            holiday.name;

        }

      });

    } else {

      // API가 아직 공개하지 않은 미래 연도도 달력에서 비지 않도록 표시합니다.
      addPlannedHolidays(year);

      console.warn(
        '공식 공휴일 자료가 없어 예비 일정을 표시했습니다.',
        error || data
      );

    }


    loadedHolidayYears.add(year);

  }

  function renderCalendar() {

    document
      .getElementById('currentMonthStr')
      .innerText =
      `${currentYear}년 ${currentMonth + 1}월`;


    const grid =
      document.getElementById(
        'calendarGrid'
      );


    grid.innerHTML = '';


    const firstDay =
      new Date(
        currentYear,
        currentMonth,
        1
      ).getDay();


    const lastDate =
      new Date(
        currentYear,
        currentMonth + 1,
        0
      ).getDate();


    for (
      let i = 0;
      i < firstDay;
      i++
    ) {

      grid.innerHTML +=
        `<div></div>`;

    }


    for (
      let d = 1;
      d <= lastDate;
      d++
    ) {

      const dateObj =
        new Date(
          currentYear,
          currentMonth,
          d
        );


      const yyyy =
        currentYear;


      const mm =
        String(
          currentMonth + 1
        ).padStart(
          2,
          '0'
        );


      const dd =
        String(d).padStart(
          2,
          '0'
        );


      const dateStr =
        `${yyyy}-${mm}-${dd}`;


      const dayOfWeek =
        dateObj.getDay();


      const holidayName =
        HOLIDAYS[dateStr];


      let dateColorStyle = '';


      if (
        dayOfWeek === 0 ||
        holidayName
      ) {

        dateColorStyle =
          'color: #e74c3c;';

      } else if (
        dayOfWeek === 6
      ) {

        dateColorStyle =
          'color: #007bff;';

      }


      let holidayHtml =
        holidayName
          ? `<span class="holiday-name">(${holidayName})</span>`
          : '';


      let dayHtml = `
        <div class="day-cell">

          <div class="day-header-bar">

            <div
              class="day-date-part"
              style="${dateColorStyle}"
            >
              ${mm}/${dd} ${holidayHtml}
            </div>

            <div class="day-sub-title">
              대근

          </div>

      /*
       * ======================================
       * A / B / C / D 조
       * ======================================
       */

      TEAMS.forEach(team => {

        const shift =
          getShiftInfo(
            team,
            dateObj
          );


        const isMyTeam =
          (
            currentUser &&
            team === currentUser.team
          )
            ? 'my-team-row'
            : '';


        const offRequestClass =
          (
            shift === '휴무'
          )
            ? 'off-request-cell'
            : '';


        const reqsForTeam =
          requestsData.filter(
            r =>
              r.shift_date === dateStr &&

          currentUser
            ? reqsForTeam.some(
                r =>
                  r.requested_by ===
                  currentUser.name
              )

        let teamHtml = '';

        let suggestedTeam = '';


        if (
          shift !== '휴무'
        ) {

          suggestedTeam =
            getSuggestedHelperTeam(
              team,
              shift,
              dateObj
            );

        }


        /*
         * ==================================
         * 이미 휴무 신청이 있는 경우
         * ==================================
         */

        if (
          reqsForTeam.length > 0
        ) {

          reqsForTeam.forEach(req => {

            let reasonHtml =
              req.reason
                ? `<span class="reason-text">(${req.reason})</span>`
                : '';


            let reqName = `
              <div class="has-data req-data">
                <span>${req.requested_by}</span>

              </div>
            `;


            let reqClick = '';

            let reqClass =
              `cell-name ${offRequestClass}`;


            /*
             * 휴무 취소
             *
             * 일반 사용자:
             * 본인 신청만
             *
             * 슈퍼관리자:
             * 전체
             */

              currentUser &&

          ) {

  async function requestOff(

  ) {

    if (!currentUser) {

      alert(

    }


    /*
     * 조 관리자는 휴무 등록 불가
     */

    if (
      isTeamAdmin()
    ) {

      alert(
        "🚫 조 관리자 계정으로는 휴무 신청을 할 수 없습니다."
      );

      return;

    }


    /*
     * 슈퍼관리자:
     * 클릭한 조
     *
     * 일반 사용자:
     * 본인 조
     */

    const requestTeam =
      isSuperAdmin()
        ? targetTeam
        : currentUser.team;


    const reason =
      prompt(
        `[${requestTeam}조 / ${date}] 휴무 사유를 적어주세요.\n` +
        `(예: 연차, 경조사 등. 비워둬도 됩니다)\n\n` +
        `※ 취소를 누르면 신청되지 않습니다.`
      );


    if (
      reason === null
    ) {

      return;

    }


    const {
      error
    } =
      await supabaseClient
        .from('requests')
        .insert([

          {
            requested_by:
              currentUser.name,

            team:
              requestTeam,

            shift_type:
              shift,

            shift_date:
              date,

            reason:
              reason,

            status:
              'OPEN'

          }

        ]);


    if (error) {

      alert(
        "❌ 휴무 신청 저장 실패: " +
        error.message
      );

    } else {

      loadData();

    }

  }


  /*
   * ==========================================
   * 메모
   * ==========================================
   */

  async function editMemo(
    date,
    currentMemo
  ) {

    if (!currentUser) {

      alert(
        "로그인 후 이용해 주세요."
      );

      return;

    }


    const newMemo =
      prompt(
        `[${date}] 일정/메모를 입력하세요.\n\n` +
        `※ 내용을 모두 지우고 확인을 누르면 삭제됩니다.`,
        currentMemo
      );


    if (
      newMemo === null
    ) {

      return;

    }


    let error;


    if (
      newMemo.trim() === ''
    ) {

      const res =
        await supabaseClient
          .from('daily_memos')
          .delete()
          .eq(
            'date',
            date
          );

      error =
        res.error;

    } else {

      const res =
        await supabaseClient
          .from('daily_memos')
          .upsert([

            {
              date:
                date,

              memo:
                newMemo,

              created_by:
                currentUser.name

            }

          ]);

      error =
        res.error;

    }


    if (error) {

      alert(
        "❌ 메모 저장 실패: " +
        error.message
      );

    } else {

      loadData();

    }

  }


  /*
   * ==========================================
   * 대근 등록
   * ==========================================
   */

  async function acceptRequest(
    id,
    targetTeam,
    dateStr,
    shiftType
  ) {

    if (!currentUser) {

      alert(
        "로그인 후 이용해 주세요."
      );

      return;

    }


    if (!canRegisterSubstitution(targetTeam)) {

      if (currentUser.role === 'team_admin') {
        alert(
          `🚫 ${currentUser.team}조 관리자입니다.\n` +
          `다른 조(${targetTeam}조)의 대근에는 관여할 수 없습니다.`
        );
      } else if (currentUser.role === 'user' && targetTeam === currentUser.team) {
        alert("🚫 일반 사용자는 다른 조의 휴무에만 대근 등록할 수 있습니다.");
      } else {
        alert("🚫 대근 등록 권한이 없습니다.");
      }

      return;

    }


    let subName =
      currentUser.name;


    const targetDateObj =
      new Date(dateStr);


    const expectedTeamStr =
      getSuggestedHelperTeam(
        targetTeam,
        shiftType,
        targetDateObj
      );


    const expectedTeamLetter =
      expectedTeamStr
        ? expectedTeamStr.replace(
            '조',
            ''
          )
        : '';


    /*
     * 조 관리자 / 슈퍼관리자
     *
     * 대근자를 직접 지정
     */

    if (
      isManager()
    ) {

      subName =
        prompt(
          `이 근무를 대근할 분의 이름을 직접 입력하세요.\n` +
          `(추천 대근 조: ${expectedTeamStr} 또는 당일 비번자)`,
          ""
        );


      if (
        !subName ||
        !subName.trim()
      ) {

        return;

      }


      subName =
        subName.trim();


      const {
        data: userRows,
        error: userError
      } =
        await supabaseClient
          .from('app_users')
          .select(
            'name, team, role, is_active'
          )
          .eq(
            'name',
            subName
          )
          .eq(
            'is_active',
            true
          );


      if (userError) {

        alert(
          "사용자 조회 실패: " +
          userError.message
        );

        return;

      }


      if (
        !userRows ||
        userRows.length === 0
      ) {

        alert(
          `🚫 오류: "${subName}"은(는) ` +
          `시스템에 등록되지 않은 사용자 이름입니다.`
        );

        return;

      }


      const foundUser =
        userRows[0];


      const subTeam =
        foundUser.team;


      /*
       * 같은 조 대근 금지
       */

      if (
        subTeam === targetTeam
      ) {

        alert(
          `🚫 오류: 같은 조(${targetTeam}조) ` +
          `인원은 대근을 설 수 없습니다!`
        );

        return;

      }


      const subTeamShiftOnDay =
        getShiftInfo(
          subTeam,
          targetDateObj
        );


      const isOfficialHelper =
        (
          expectedTeamLetter &&
          subTeam ===
            expectedTeamLetter
        );


      /*
       * 지정 대근 조 또는 당일 휴무자만 허용
       */

      if (
        !isOfficialHelper &&
        subTeamShiftOnDay !== '휴무'
      ) {

        alert(
          `🚫 오류: "${subName}" 님 소속(${subTeam}조)은 ` +
          `당일 비번(휴무) 조가 아니므로 대근을 설 수 없습니다.\n` +
          `(지정 대근 조 또는 당일 휴무인 조 인원만 가능합니다)`
        );

        return;

      }


    } else {

      /*
       * 일반 사용자
       */

      if (
        currentUser.team ===
        targetTeam
      ) {

        alert(
          "🚫 오류: 같은 조 인원은 대근을 설 수 없습니다!"
        );

        return;

      }


      const myShiftOnDay =
        getShiftInfo(
          currentUser.team,
          targetDateObj
        );


      const isOfficialHelper =
        (
          expectedTeamLetter &&
          currentUser.team ===
            expectedTeamLetter
        );


      if (
        !isOfficialHelper &&
        myShiftOnDay !== '휴무'
      ) {

        alert(
          `🚫 오류: 현재 본인 소속(${currentUser.team}조)은 ` +
          `당일 비번(휴무) 조가 아니므로 대근을 설 수 없습니다.`
        );

        return;

      }


      if (
        !confirm(
          "이 근무를 대근하시겠습니까?"
        )
      ) {

        return;

      }

    }


    let error;


    /*
     * ======================================
     * 새 공석 대근
     * ======================================
     */

    if (
      String(id).startsWith('new_')
    ) {

      const parts =
        id.split('_');


      const tTeam =
        parts[1];


      const tDate =
        parts[2];


      const shift =
        getShiftInfo(
          tTeam,
          new Date(tDate)
        );


      const res =
        await supabaseClient
          .from('requests')
          .insert([

            {

              requested_by:
                `${tTeam}조 공석`,

              team:
                tTeam,

              shift_type:
                shift,

              shift_date:
                tDate,

              reason:
                '지정 대근',

              status:
                'FILLED',

              filled_by:
                subName

            }

          ]);


      error =
        res.error;


    } else {

      /*
       * 기존 휴무 신청에 대근자 지정
       */

      const res =
        await supabaseClient
          .from('requests')
          .update({

            status:
              'FILLED',

            filled_by:
              subName

          })
          .eq(
            'id',
            id
          );


      error =
        res.error;

    }


    if (error) {

      alert(
        "❌ 대근 등록 실패: " +
        error.message
      );

    } else {

      loadData();

    }

  }


  /*
   * ==========================================
   * 대근 취소
   * ==========================================
   */

  async function cancelSub(id) {

    if (!currentUser) {

      alert(
        "로그인 후 이용해 주세요."
      );

      return;

    }


    const targetRequest =
      requestsData.find(
        r =>
          String(r.id) ===
          String(id)
      );


    if (!targetRequest) {

      alert(
        "대근 정보를 찾을 수 없습니다."
      );

      return;

    }


    /*
     * 일반 사용자
     *
     * 본인이 등록한 대근만 취소
     */

    if (
      currentUser.role === 'user' &&
      targetRequest.filled_by !==
        currentUser.name
    ) {

      alert(
        "🚫 본인이 등록한 대근만 취소할 수 있습니다."
      );

      return;

    }


    /*
     * 조 관리자
     *
     * 자기 조의 대근만 취소
     */

    if (
      isTeamAdmin() &&
      targetRequest.team !==
        currentUser.team
    ) {

      alert(
        `🚫 ${currentUser.team}조 관리자입니다.\n` +
        `다른 조의 대근은 취소할 수 없습니다.`
      );

      return;

    }


    /*
     * admin은 전체 조 가능
     */

    if (
      !confirm(
        "해당 대근 내역을 취소(삭제)하시겠습니까?"
      )
    ) {

      return;

    }


    const {
      error
    } =
      await supabaseClient
        .from('requests')
        .update({

          status:
            'OPEN',

          filled_by:
            null

        })
        .eq(
          'id',
          id
        );


    if (error) {

      alert(
        "❌ 대근 취소 실패: " +
        error.message
      );

    } else {

      loadData();

    }

  }


  /*
   * ==========================================
   * 휴무 취소
   * ==========================================
   */

  async function deleteRequest(
    id,
    type
  ) {

    if (!currentUser) {

      alert(
        "로그인 후 이용해 주세요."
      );

      return;

    }


    const targetRequest =
      requestsData.find(
        r =>
          String(r.id) ===
          String(id)
      );


    if (!targetRequest) {

      alert(
        "휴무 신청 정보를 찾을 수 없습니다."
      );

      return;

    }


    /*
     * 일반 사용자:
     * 본인 휴무만 취소
     */

    if (
      currentUser.role === 'user' &&
      targetRequest.requested_by !==
        currentUser.name
    ) {

      alert(
        "🚫 본인의 휴무 신청만 취소할 수 있습니다."
      );

      return;

    }


    /*
     * 조 관리자:
     * 휴무 취소 불가
     */

    if (
      isTeamAdmin()
    ) {

      alert(
        "🚫 조 관리자 계정은 휴무 신청을 취소할 수 없습니다."
      );

      return;

    }


    /*
     * admin:
     * 모든 조 휴무 취소 가능
     */

    if (
      !confirm(
        `${type}을(를) 취소(삭제)하시겠습니까?`
      )
    ) {

      return;

    }


    const {
      error
    } =
      await supabaseClient
        .from('requests')
        .delete()
        .eq(
          'id',
          id
        );


    if (error) {

      alert(
        "❌ 삭제 실패: " +
        error.message
      );

    } else {

      loadData();

    }

  }


  /*
   * ==========================================
   * Enter 로그인
   * ==========================================
   */

  document
    .getElementById('loginCode')
    .addEventListener(
      'keydown',
      function(e) {

        if (
          e.key === 'Enter'
        ) {

          login();

        }

      }
    );

</script>
