<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNNC 환원반 휴무계획표</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: 'Malgun Gothic', sans-serif;
      padding: 10px;
      background-color: #e9ecef;
      margin: 0;
      color: #333;
    }

    .card {
      background: white;
      padding: 15px;
      border-radius: 8px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px;
      margin: 8px 0 15px 0;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      font-size: 15px;
    }

    .btn-small {
      width: auto;
      padding: 6px 12px;
      font-size: 13px;
      margin: 0;
    }

    .cal-wrapper {
      overflow-x: auto;
      padding-bottom: 10px;
    }

    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      min-width: 950px;
      border-top: 2px solid #555;
      border-left: 1px solid #ccc;
      background: #fff;
    }

    .cal-header-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      min-width: 950px;
      text-align: center;
      font-weight: bold;
      background: #f8f9fa;
      border-left: 1px solid #ccc;
    }

    .cal-header-cell {
      padding: 8px 0;
      border-right: 1px solid #ccc;
      border-bottom: 1px solid #ccc;
      font-size: 14px;
    }

    .day-cell {
      border-right: 1px solid #ccc;
      border-bottom: 1px solid #ccc;
      display: flex;
      flex-direction: column;
    }

    .day-header-bar {
      display: flex;
      background: #f1f3f5;
      border-bottom: 1px solid #ddd;
      font-size: 12px;
      font-weight: bold;
      text-align: center;
    }

    .day-date-part {
      width: calc(45px + 100% - 45px);
      flex: 2;
      padding: 4px;
      border-right: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .day-sub-title {
      flex: 1;
      padding: 4px;
      color: #0056b3;
      background: #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .holiday-name {
      font-size: 11px;
      font-weight: normal;
      margin-left: 3px;
      letter-spacing: -0.5px;
    }

    .team-row {
      display: flex;
      min-height: 35px;
      border-bottom: 1px solid #eee;
      font-size: 12px;
    }

    .memo-row {
      border-top: 1px solid #ccc;
      background-color: #fff9c4;
      border-bottom: none;
    }

    .my-team-row {
      background-color: #e6f2ff;
    }

    .cell-shift {
      width: 45px;
      flex-shrink: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: bold;
      border-right: 1px solid #eee;
    }

    .cell-name {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      border-right: 1px solid #eee;
      color: #495057;
      position: relative;
    }

    .cell-name:last-child {
      border-right: none;
    }

    .off-request-cell {
      background-color: #ffffff !important;
    }

    .clickable {
      cursor: pointer;
    }

    .clickable:hover {
      background-color: #f1f3f5;
    }

    .has-data {
      font-weight: bold;
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1.2;
    }

    .req-data {
      color: #1e8449;
    }

    .sub-data {
      color: #27ae60;
      background-color: #e8f8f5;
      width: 100%;
      height: 100%;
      justify-content: center;
      display: flex;
      align-items: center;
    }

    .reason-text {
      font-size: 10px;
      color: #888;
      font-weight: normal;
    }

    .suggest-box {
      background-color: #e2e8f0;
    }

    .suggest-guide {
      color: #0056b3;
      font-weight: bold;
      font-size: 12px;
    }

    .s-day {
      color: #1e8449;
      font-weight: bold;
    }

    .s-night {
      color: #2980b9;
      font-weight: bold;
    }

    .s-off {
      color: #7f8c8d;
    }

    #mainScreen {
      display: none;
    }
  </style>
</head>

<body>

  <!-- 로그인 -->
  <div id="loginScreen"
       class="card"
       style="max-width: 400px; margin: 50px auto; text-align: center;">

    <h2>🔒 교대근무 로그인</h2>

    <input
      type="password"
      id="loginCode"
      placeholder="비밀번호 입력"
      maxlength="50"
      style="text-align: center; font-size: 20px; letter-spacing: 2px;"
    >

    <button onclick="login()">로그인</button>

  </div>


  <!-- 메인 -->
  <div id="mainScreen">

    <div class="card"
         style="margin-bottom: 10px; padding: 10px 15px;">

      <div style="
        display: flex;
        justify-content: space-between;
        align-items: center;
      ">

        <h2 id="welcomeMsg"
            style="margin: 0; font-size: 16px;">
          환영합니다!
        </h2>

        <button
          onclick="logout()"
          class="btn-small"
          style="background-color: #6c757d;"
        >
          로그아웃
        </button>

      </div>

    </div>


    <div class="card" style="padding: 10px;">

      <div style="
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      ">

        <button
          onclick="changeMonth(-1)"
          class="btn-small"
          style="background-color: #e9ecef; color: black;"
        >
          ◀ 이전달
        </button>

        <h3 id="currentMonthStr"
            style="margin: 0; font-size: 18px;">
          2026년 9월
        </h3>

        <button
          onclick="changeMonth(1)"
          class="btn-small"
          style="background-color: #e9ecef; color: black;"
        >
          다음달 ▶
        </button>

      </div>


      <p style="
        font-size: 12px;
        color: #555;
        margin-bottom: 10px;
        line-height: 1.4;
      ">

        💡 <strong>휴무 신청:</strong>
        일반 사용자 및 슈퍼관리자는 휴무 신청 가능
        (조 관리자는 휴무 신청 불가)<br>

        💡 <strong>대근 신청:</strong>
        일반 사용자는 본인 대근,
        조 관리자는 자기 조 대근,
        슈퍼관리자는 전체 조 대근 가능

      </p>


      <div class="cal-wrapper">

        <div class="cal-header-row">

          <div class="cal-header-cell"
               style="color: red;">
            일
          </div>

          <div class="cal-header-cell">월</div>
          <div class="cal-header-cell">화</div>
          <div class="cal-header-cell">수</div>
          <div class="cal-header-cell">목</div>
          <div class="cal-header-cell">금</div>

          <div class="cal-header-cell"
               style="color: blue;">
            토
          </div>

        </div>

        <div id="calendarGrid"
             class="cal-grid"></div>

      </div>

    </div>

  </div>


<script>

  /*
   * ==========================================
   * SUPABASE 설정
   * ==========================================
   */

  const SUPABASE_URL =
    'https://lqqjyedfwlqinppcrvjf.supabase.co';

  /*
   * 형님이 기존에 사용하시던 ANON KEY를 입력하세요.
   */
  const SUPABASE_ANON_KEY =
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxxcWp5ZWRmd2xxaW5wcGNydmpmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3MzQ3NDgsImV4cCI6MjEwNjMxMDc0OH0.8N5fmaNOdNG1hKDTzAYYX6Pd9bc0AnJvBzGQpfsndFo';

  const supabaseClient =
    supabase.createClient(
      SUPABASE_URL,
      SUPABASE_ANON_KEY
    );


  /*
   * ==========================================
   * 공휴일
   * ==========================================
   */

  const HOLIDAYS = {

    "2026-01-01": "신정",

    "2026-02-16": "설연휴",
    "2026-02-17": "설날",
    "2026-02-18": "설연휴",

    "2026-03-01": "3·1절",

    "2026-05-05": "어린이날",
    "2026-05-24": "부처님오신날",
    "2026-06-06": "현충일",

    "2026-08-15": "광복절",

    "2026-09-24": "추석연휴",
    "2026-09-25": "추석",
    "2026-09-26": "추석연휴",

    "2026-10-03": "개천절",
    "2026-10-09": "한글날",
    "2026-12-25": "성탄절",

    "2027-01-01": "신정",

    "2027-02-06": "설연휴",
    "2027-02-07": "설날",
    "2027-02-08": "설연휴",
    "2027-02-09": "대체휴무",

    "2027-03-01": "3·1절",
    "2027-05-05": "어린이날",
    "2027-05-13": "부처님오신날",
    "2027-06-06": "현충일",

    "2027-08-15": "광복절",

    "2027-09-14": "추석연휴",
    "2027-09-15": "추석",
    "2027-09-16": "추석연휴",

    "2027-10-03": "개천절",
    "2027-10-09": "한글날",
    "2027-12-25": "성탄절"

  };


  /*
   * ==========================================
   * 전역 변수
   * ==========================================
   */

  let currentUser = null;

  let currentYear =
    new Date().getFullYear();

  let currentMonth =
    new Date().getMonth();

  let requestsData = [];

  let memosData = [];


  /*
   * ==========================================
   * 교대 패턴
   * ==========================================
   */

  const PATTERN = [
    '주간',
    '주간',
    '휴무',
    '휴무',
    '야간',
    '야간',
    '휴무',
    '휴무'
  ];


  const TEAM_OFFSET = {

    'A': 0,
    'C': 2,
    'D': 4,
    'B': 6

  };


  const BASE_DATE =
    new Date('2026-09-30T00:00:00');


  const TEAMS = [
    'A',
    'B',
    'C',
    'D'
  ];


  /*
   * ==========================================
   * 권한 함수
   * ==========================================
   */

  // 슈퍼관리자
  function isSuperAdmin() {

    return (
      currentUser &&
      currentUser.role === 'admin'
    );

  }


  // 조 관리자
  function isTeamAdmin() {

    return (
      currentUser &&
      currentUser.role === 'team_admin'
    );

  }


  // 관리자 여부
  function isManager() {

    return (
      isSuperAdmin() ||
      isTeamAdmin()
    );

  }


  /*
   * 휴무 등록 가능 여부
   *
   * user     : 가능
   * team_admin: 불가
   * admin    : 가능
   */

  function canRequestOff() {

    return (
      currentUser &&
      currentUser.is_active &&
      (
        currentUser.role === 'user' ||
        currentUser.role === 'admin'
      )
    );

  }


  /*
   * 대근 기능 사용 가능 여부
   */

  function canDoSubstitution() {

    return (
      currentUser &&
      currentUser.is_active &&
      (
        currentUser.role === 'user' ||
        currentUser.role === 'team_admin' ||
        currentUser.role === 'admin'
      )
    );

  }


  /*
   * ==========================================
   * 근무 계산
   * ==========================================
   */

  function getShiftInfo(
    team,
    dateObj
  ) {

    const targetDate =
      new Date(
        dateObj.getFullYear(),
        dateObj.getMonth(),
        dateObj.getDate()
      );

    const baseDate =
      new Date(
        BASE_DATE.getFullYear(),
        BASE_DATE.getMonth(),
        BASE_DATE.getDate()
      );

    const diffTime =
      targetDate - baseDate;

    const diffDays =
      Math.floor(
        diffTime /
        (1000 * 60 * 60 * 24)
      );

    let index =
      (
        diffDays +
        TEAM_OFFSET[team]
      ) % 8;

    if (index < 0) {
      index += 8;
    }

    return PATTERN[index];

  }


  /*
   * ==========================================
   * 추천 대근 조
   * ==========================================
   */

  function getSuggestedHelperTeam(
    targetTeam,
    shiftType,
    dateObj
  ) {

    const prevDate =
      new Date(dateObj);

    prevDate.setDate(
      dateObj.getDate() - 1
    );


    const nextDate =
      new Date(dateObj);

    nextDate.setDate(
      dateObj.getDate() + 1
    );


    let helperTeam = '';


    TEAMS.forEach(t => {

      if (t === targetTeam) {
        return;
      }


      const pShift =
        getShiftInfo(
          t,
          prevDate
        );


      const nShift =
        getShiftInfo(
          t,
          nextDate
        );


      if (
        shiftType === '주간'
      ) {

        if (
          pShift === '주간' ||
          nShift === '주간'
        ) {

          helperTeam =
            t + '조';

        }

      } else if (
        shiftType === '야간'
      ) {

        if (
          pShift === '야간' ||
          nShift === '야간'
        ) {

          helperTeam =
            t + '조';

        }

      }

    });


    return helperTeam;

  }


  function getShortShift(shift) {

    if (shift === '주간') {
      return '주';
    }

    if (shift === '야간') {
      return '야';
    }

    return '휴';

  }


  function getShiftClass(shift) {

    if (shift === '주간') {
      return 's-day';
    }

    if (shift === '야간') {
      return 's-night';
    }

    return 's-off';

  }


  /*
   * ==========================================
   * 로그인
   * ==========================================
   */

  async function login() {

    const code =
      document
        .getElementById('loginCode')
        .value
        .trim();


    if (!code) {

      alert(
        "코드를 입력하세요."
      );

      return;

    }


    const {
      data,
      error
    } =
      await supabaseClient
        .from('app_users')
        .select(
          'name, team, role, is_active'
        )
        .eq(
          'login_code',
          code
        )
        .maybeSingle();


    if (error) {

      alert(
        "로그인 조회 실패: " +
        error.message
      );

      return;

    }


    if (!data) {

      alert(
        "코드가 일치하지 않습니다."
      );

      return;

    }


    if (!data.is_active) {

      alert(
        "비활성화된 계정입니다."
      );

      return;

    }


    currentUser = {

      name:
        data.name,

      team:
        data.team,

      role:
        data.role,

      is_active:
        data.is_active

    };


    document
      .getElementById('loginScreen')
      .style.display = 'none';


    document
      .getElementById('mainScreen')
      .style.display = 'block';


    let roleBadge = '';


    if (
      currentUser.role === 'admin'
    ) {

      roleBadge =
        '👑(슈퍼관리자)';

    } else if (
      currentUser.role === 'team_admin'
    ) {

      roleBadge =
        '🛠️(조관리자)';

    }


    document
      .getElementById('welcomeMsg')
      .innerText =
      `[${currentUser.team}조] ${currentUser.name} 님 ${roleBadge}`;


    loadData();

  }


  /*
   * ==========================================
   * 로그아웃
   * ==========================================
   */

  function logout() {

    currentUser = null;

    document
      .getElementById('loginCode')
      .value = '';

    document
      .getElementById('mainScreen')
      .style.display = 'none';

    document
      .getElementById('loginScreen')
      .style.display = 'block';

  }


  /*
   * ==========================================
   * 월 변경
   * ==========================================
   */

  function changeMonth(delta) {

    currentMonth += delta;


    if (currentMonth < 0) {

      currentMonth = 11;
      currentYear--;

    }


    if (currentMonth > 11) {

      currentMonth = 0;
      currentYear++;

    }


    loadData();

  }


  /*
   * ==========================================
   * 데이터 불러오기
   * ==========================================
   */

  async function loadData() {

    const [
      reqRes,
      memoRes
    ] =
      await Promise.all([

        supabaseClient
          .from('requests')
          .select('*'),

        supabaseClient
          .from('daily_memos')
          .select('*')

      ]);


    if (
      reqRes.error ||
      memoRes.error
    ) {

      alert(
        "데이터를 불러오지 못했습니다: " +
        (
          reqRes.error?.message ||
          memoRes.error?.message
        )
      );

      return;

    }


    requestsData =
      reqRes.data || [];


    memosData =
      memoRes.data || [];


    renderCalendar();

  }


  /*
   * ==========================================
   * 달력
   * ==========================================
   */

  function renderCalendar() {

    document
      .getElementById('currentMonthStr')
      .innerText =
      `${currentYear}년 ${currentMonth + 1}월`;


    const grid =
      document.getElementById(
        'calendarGrid'
      );


    grid.innerHTML = '';


    const firstDay =
      new Date(
        currentYear,
        currentMonth,
        1
      ).getDay();


    const lastDate =
      new Date(
        currentYear,
        currentMonth + 1,
        0
      ).getDate();


    for (
      let i = 0;
      i < firstDay;
      i++
    ) {

      grid.innerHTML +=
        `<div></div>`;

    }


    for (
      let d = 1;
      d <= lastDate;
      d++
    ) {

      const dateObj =
        new Date(
          currentYear,
          currentMonth,
          d
        );


      const yyyy =
        currentYear;


      const mm =
        String(
          currentMonth + 1
        ).padStart(
          2,
          '0'
        );


      const dd =
        String(d).padStart(
          2,
          '0'
        );


      const dateStr =
        `${yyyy}-${mm}-${dd}`;


      const dayOfWeek =
        dateObj.getDay();


      const holidayName =
        HOLIDAYS[dateStr];


      let dateColorStyle = '';


      if (
        dayOfWeek === 0 ||
        holidayName
      ) {

        dateColorStyle =
          'color: #e74c3c;';

      } else if (
        dayOfWeek === 6
      ) {

        dateColorStyle =
          'color: #007bff;';

      }


      let holidayHtml =
        holidayName
          ? `<span class="holiday-name">(${holidayName})</span>`
          : '';


      let dayHtml = `
        <div class="day-cell">

          <div class="day-header-bar">

            <div
              class="day-date-part"
              style="${dateColorStyle}"
            >
              ${mm}/${dd} ${holidayHtml}
            </div>

            <div class="day-sub-title">
              대근
            </div>

          </div>
      `;


      /*
       * ======================================
       * A / B / C / D 조
       * ======================================
       */

      TEAMS.forEach(team => {

        const shift =
          getShiftInfo(
            team,
            dateObj
          );


        const isMyTeam =
          (
            currentUser &&
            team === currentUser.team
          )
            ? 'my-team-row'
            : '';


        const offRequestClass =
          (
            shift === '휴무'
          )
            ? 'off-request-cell'
            : '';


        const reqsForTeam =
          requestsData.filter(
            r =>
              r.shift_date === dateStr &&
              r.team === team
          );


        const hasMyRequest =
          currentUser
            ? reqsForTeam.some(
                r =>
                  r.requested_by ===
                  currentUser.name
              )
            : false;


        let teamHtml = '';

        let suggestedTeam = '';


        if (
          shift !== '휴무'
        ) {

          suggestedTeam =
            getSuggestedHelperTeam(
              team,
              shift,
              dateObj
            );

        }


        /*
         * ==================================
         * 이미 휴무 신청이 있는 경우
         * ==================================
         */

        if (
          reqsForTeam.length > 0
        ) {

          reqsForTeam.forEach(req => {

            let reasonHtml =
              req.reason
                ? `<span class="reason-text">(${req.reason})</span>`
                : '';


            let reqName = `
              <div class="has-data req-data">
                <span>${req.requested_by}</span>
                ${reasonHtml}
              </div>
            `;


            let reqClick = '';

            let reqClass =
              `cell-name ${offRequestClass}`;


            /*
             * 휴무 취소
             *
             * 일반 사용자:
             * 본인 신청만
             *
             * 슈퍼관리자:
             * 전체
             */

            if (
              currentUser &&
              (
                req.requested_by ===
                  currentUser.name ||
                isSuperAdmin()
              )
            ) {

              reqClick =
                `onclick="deleteRequest('${req.id}', '휴무 신청')"`;

              reqClass +=
                ' clickable';

            }


            let subName = '';

            let subClick = '';

            let subCellClass =
              'cell-name clickable';


            /*
             * ==================================
             * 대근자가 이미 있는 경우
             * ==================================
             */

            if (
              req.filled_by
            ) {

              subName = `
                <div class="has-data sub-data">
                  <span>${req.filled_by}</span>
                </div>
              `;


              /*
               * 대근 취소 권한
               *
               * 일반 사용자:
               * 본인이 선 대근
               *
               * 조 관리자:
               * 자기 조
               *
               * 슈퍼관리자:
               * 전체
               */

              if (
                currentUser &&
                (
                  req.filled_by ===
                    currentUser.name ||

                  isSuperAdmin() ||

                  (
                    isTeamAdmin() &&
                    req.team ===
                      currentUser.team
                  )
                )
              ) {

                subClick =
                  `onclick="cancelSub('${req.id}')"`;

              }

            } else {

              /*
               * ==================================
               * 대근 등록 권한
               * ==================================
               *
               * 일반 사용자:
               * 본인이 가능한 경우
               *
               * 조 관리자:
               * 자기 조만
               *
               * 슈퍼관리자:
               * 전체 조
               */

              if (
                canDoSubstitution() &&
                (
                  isSuperAdmin() ||
                  team === currentUser.team
                )
              ) {

                subClick =
                  `onclick="acceptRequest('${req.id}', '${team}', '${dateStr}', '${shift}')"`;

              }


              if (
                suggestedTeam
              ) {

                subName =
                  `<span class="suggest-guide">${suggestedTeam}</span>`;

                subCellClass +=
                  ' suggest-box';

              }

            }


            teamHtml += `

              <div class="team-row ${isMyTeam}">

                <div class="cell-shift ${getShiftClass(shift)}">
                  ${team}${getShortShift(shift)}
                </div>

                <div
                  class="${reqClass}"
                  ${reqClick}
                  title="${reqClick ? '클릭 시 삭제' : ''}"
                >
                  ${reqName}
                </div>

                <div
                  class="${subCellClass}"
                  ${subClick}
                  title="클릭 시 대근 등록/취소"
                >
                  ${subName}
                </div>

              </div>

            `;

          });

        }


        /*
         * ==================================
         * 휴무 신청이 전혀 없는 경우
         * ==================================
         */

        if (
          reqsForTeam.length === 0
        ) {

          let reqClick = '';

          let reqClass =
            `cell-name ${offRequestClass}`;


          /*
           * 일반 사용자:
           * 자기 조
           *
           * 슈퍼관리자:
           * 모든 조
           */

          if (
            canRequestOff() &&
            shift !== '휴무' &&
            (
              isSuperAdmin() ||
              team === currentUser.team
            )
          ) {

            reqClick =
              `onclick="requestOff('${dateStr}', '${shift}', '${team}')"`;

            reqClass +=
              ' clickable';

          }


          let subCellClass =
            'cell-name clickable';


          let subClick =
            `onclick="alert('🚫 해당 날짜/조에 휴무 신청(공석)이 없어 대근을 등록할 수 없습니다.');"`;


          let suggestGuideHtml = '';


          if (
            shift !== '휴무' &&
            suggestedTeam
          ) {

            suggestGuideHtml =
              `<span class="suggest-guide">${suggestedTeam}</span>`;

            subCellClass +=
              ' suggest-box';

          }


          teamHtml += `

            <div class="team-row ${isMyTeam}">

              <div class="cell-shift ${getShiftClass(shift)}">
                ${team}${getShortShift(shift)}
              </div>

              <div
                class="${reqClass}"
                ${reqClick}
                title="${reqClick ? '클릭 시 휴무 신청' : ''}"
              ></div>

              <div
                class="${subCellClass}"
                ${subClick}
                title="휴무 신청이 없을 때는 대근 등록 불가"
              >
                ${suggestGuideHtml}
              </div>

            </div>

          `;

        }


        /*
         * ==================================
         * 이미 휴무가 있지만
         * 내가 아직 신청하지 않은 경우
         * ==================================
         */

        else if (
          canRequestOff() &&
          shift !== '휴무' &&
          !hasMyRequest &&
          (
            isSuperAdmin() ||
            team === currentUser.team
          )
        ) {

          let reqClick =
            `onclick="requestOff('${dateStr}', '${shift}', '${team}')"`;

          let reqClass =
            `cell-name ${offRequestClass} clickable`;


          let subCellClass =
            'cell-name clickable';


          let subClick =
            `onclick="alert('🚫 해당 날짜/조에 휴무 신청(공석)이 없어 대근을 등록할 수 없습니다.');"`;


          let suggestGuideHtml = '';


          if (
            shift !== '휴무' &&
            suggestedTeam
          ) {

            suggestGuideHtml =
              `<span class="suggest-guide">${suggestedTeam}</span>`;

            subCellClass +=
              ' suggest-box';

          }


          teamHtml += `

            <div class="team-row ${isMyTeam}">

              <div class="cell-shift ${getShiftClass(shift)}">
                ${team}${getShortShift(shift)}
              </div>

              <div
                class="${reqClass}"
                ${reqClick}
                title="클릭 시 휴무 신청"
              ></div>

              <div
                class="${subCellClass}"
                ${subClick}
                title="휴무 신청이 없을 때는 대근 등록 불가"
              >
                ${suggestGuideHtml}
              </div>

            </div>

          `;

        }


        dayHtml +=
          teamHtml;

      });


      /*
       * ==================================
       * 메모
       * ==================================
       */

      const memoObj =
        memosData.find(
          m =>
            m.date === dateStr
        );


      const memoText =
        memoObj
          ? memoObj.memo
          : '';


      const safeMemoText =
        memoText.replace(
          /'/g,
          "\\'"
        );


      dayHtml += `

        <div class="team-row memo-row">

          <div
            class="cell-shift"
            style="
              color: #795548;
              font-size: 10px;
            "
          >
            메모
          </div>

          <div
            class="cell-name clickable"
            style="
              justify-content: flex-start;
              padding: 0 4px;
              font-size: 11px;
              font-weight: bold;
              color: #333;
            "
            onclick="editMemo('${dateStr}', '${safeMemoText}')"
          >
            ${memoText}
          </div>

        </div>

      </div>

      `;


      grid.innerHTML +=
        dayHtml;

    }

  }


  /*
   * ==========================================
   * 휴무 신청
   * ==========================================
   */

  async function requestOff(
    date,
    shift,
    targetTeam
  ) {

    if (!currentUser) {

      alert(
        "로그인 후 이용해 주세요."
      );

      return;

    }


    /*
     * 조 관리자는 휴무 등록 불가
     */

    if (
      isTeamAdmin()
    ) {

      alert(
        "🚫 조 관리자 계정으로는 휴무 신청을 할 수 없습니다."
      );

      return;

    }


    /*
     * 슈퍼관리자:
     * 클릭한 조
     *
     * 일반 사용자:
     * 본인 조
     */

    const requestTeam =
      isSuperAdmin()
        ? targetTeam
        : currentUser.team;


    const reason =
      prompt(
        `[${requestTeam}조 / ${date}] 휴무 사유를 적어주세요.\n` +
        `(예: 연차, 경조사 등. 비워둬도 됩니다)\n\n` +
        `※ 취소를 누르면 신청되지 않습니다.`
      );


    if (
      reason === null
    ) {

      return;

    }


    const {
      error
    } =
      await supabaseClient
        .from('requests')
        .insert([

          {
            requested_by:
              currentUser.name,

            team:
              requestTeam,

            shift_type:
              shift,

            shift_date:
              date,

            reason:
              reason,

            status:
              'OPEN'

          }

        ]);


    if (error) {

      alert(
        "❌ 휴무 신청 저장 실패: " +
        error.message
      );

    } else {

      loadData();

    }

  }


  /*
   * ==========================================
   * 메모
   * ==========================================
   */

  async function editMemo(
    date,
    currentMemo
  ) {

    if (!currentUser) {

      alert(
        "로그인 후 이용해 주세요."
      );

      return;

    }


    const newMemo =
      prompt(
        `[${date}] 일정/메모를 입력하세요.\n\n` +
        `※ 내용을 모두 지우고 확인을 누르면 삭제됩니다.`,
        currentMemo
      );


    if (
      newMemo === null
    ) {

      return;

    }


    let error;


    if (
      newMemo.trim() === ''
    ) {

      const res =
        await supabaseClient
          .from('daily_memos')
          .delete()
          .eq(
            'date',
            date
          );

      error =
        res.error;

    } else {

      const res =
        await supabaseClient
          .from('daily_memos')
          .upsert([

            {
              date:
                date,

              memo:
                newMemo,

              created_by:
                currentUser.name

            }

          ]);

      error =
        res.error;

    }


    if (error) {

      alert(
        "❌ 메모 저장 실패: " +
        error.message
      );

    } else {

      loadData();

    }

  }


  /*
   * ==========================================
   * 대근 등록
   * ==========================================
   */

  async function acceptRequest(
    id,
    targetTeam,
    dateStr,
    shiftType
  ) {

    if (!currentUser) {

      alert(
        "로그인 후 이용해 주세요."
      );

      return;

    }


    if (!canDoSubstitution()) {

      alert(
        "🚫 대근 등록 권한이 없습니다."
      );

      return;

    }


    /*
     * 조 관리자는 자기 조만 가능
     */

    if (
      isTeamAdmin() &&
      targetTeam !== currentUser.team
    ) {

      alert(
        `🚫 ${currentUser.team}조 관리자입니다.\n` +
        `다른 조(${targetTeam}조)의 대근에는 관여할 수 없습니다.`
      );

      return;

    }


    let subName =
      currentUser.name;


    const targetDateObj =
      new Date(dateStr);


    const expectedTeamStr =
      getSuggestedHelperTeam(
        targetTeam,
        shiftType,
        targetDateObj
      );


    const expectedTeamLetter =
      expectedTeamStr
        ? expectedTeamStr.replace(
            '조',
            ''
          )
        : '';


    /*
     * 조 관리자 / 슈퍼관리자
     *
     * 대근자를 직접 지정
     */

    if (
      isManager()
    ) {

      subName =
        prompt(
          `이 근무를 대근할 분의 이름을 직접 입력하세요.\n` +
          `(추천 대근 조: ${expectedTeamStr} 또는 당일 비번자)`,
          ""
        );


      if (
        !subName ||
        !subName.trim()
      ) {

        return;

      }


      subName =
        subName.trim();


      const {
        data: userRows,
        error: userError
      } =
        await supabaseClient
          .from('app_users')
          .select(
            'name, team, role, is_active'
          )
          .eq(
            'name',
            subName
          )
          .eq(
            'is_active',
            true
          );


      if (userError) {

        alert(
          "사용자 조회 실패: " +
          userError.message
        );

        return;

      }


      if (
        !userRows ||
        userRows.length === 0
      ) {

        alert(
          `🚫 오류: "${subName}"은(는) ` +
          `시스템에 등록되지 않은 사용자 이름입니다.`
        );

        return;

      }


      const foundUser =
        userRows[0];


      const subTeam =
        foundUser.team;


      /*
       * 같은 조 대근 금지
       */

      if (
        subTeam === targetTeam
      ) {

        alert(
          `🚫 오류: 같은 조(${targetTeam}조) ` +
          `인원은 대근을 설 수 없습니다!`
        );

        return;

      }


      const subTeamShiftOnDay =
        getShiftInfo(
          subTeam,
          targetDateObj
        );


      const isOfficialHelper =
        (
          expectedTeamLetter &&
          subTeam ===
            expectedTeamLetter
        );


      /*
       * 지정 대근 조 또는 당일 휴무자만 허용
       */

      if (
        !isOfficialHelper &&
        subTeamShiftOnDay !== '휴무'
      ) {

        alert(
          `🚫 오류: "${subName}" 님 소속(${subTeam}조)은 ` +
          `당일 비번(휴무) 조가 아니므로 대근을 설 수 없습니다.\n` +
          `(지정 대근 조 또는 당일 휴무인 조 인원만 가능합니다)`
        );

        return;

      }


    } else {

      /*
       * 일반 사용자
       */

      if (
        currentUser.team ===
        targetTeam
      ) {

        alert(
          "🚫 오류: 같은 조 인원은 대근을 설 수 없습니다!"
        );

        return;

      }


      const myShiftOnDay =
        getShiftInfo(
          currentUser.team,
          targetDateObj
        );


      const isOfficialHelper =
        (
          expectedTeamLetter &&
          currentUser.team ===
            expectedTeamLetter
        );


      if (
        !isOfficialHelper &&
        myShiftOnDay !== '휴무'
      ) {

        alert(
          `🚫 오류: 현재 본인 소속(${currentUser.team}조)은 ` +
          `당일 비번(휴무) 조가 아니므로 대근을 설 수 없습니다.`
        );

        return;

      }


      if (
        !confirm(
          "이 근무를 대근하시겠습니까?"
        )
      ) {

        return;

      }

    }


    let error;


    /*
     * ======================================
     * 새 공석 대근
     * ======================================
     */

    if (
      String(id).startsWith('new_')
    ) {

      const parts =
        id.split('_');


      const tTeam =
        parts[1];


      const tDate =
        parts[2];


      const shift =
        getShiftInfo(
          tTeam,
          new Date(tDate)
        );


      const res =
        await supabaseClient
          .from('requests')
          .insert([

            {

              requested_by:
                `${tTeam}조 공석`,

              team:
                tTeam,

              shift_type:
                shift,

              shift_date:
                tDate,

              reason:
                '지정 대근',

              status:
                'FILLED',

              filled_by:
                subName

            }

          ]);


      error =
        res.error;


    } else {

      /*
       * 기존 휴무 신청에 대근자 지정
       */

      const res =
        await supabaseClient
          .from('requests')
          .update({

            status:
              'FILLED',

            filled_by:
              subName

          })
          .eq(
            'id',
            id
          );


      error =
        res.error;

    }


    if (error) {

      alert(
        "❌ 대근 등록 실패: " +
        error.message
      );

    } else {

      loadData();

    }

  }


  /*
   * ==========================================
   * 대근 취소
   * ==========================================
   */

  async function cancelSub(id) {

    if (!currentUser) {

      alert(
        "로그인 후 이용해 주세요."
      );

      return;

    }


    const targetRequest =
      requestsData.find(
        r =>
          String(r.id) ===
          String(id)
      );


    if (!targetRequest) {

      alert(
        "대근 정보를 찾을 수 없습니다."
      );

      return;

    }


    /*
     * 일반 사용자
     *
     * 본인이 등록한 대근만 취소
     */

    if (
      currentUser.role === 'user' &&
      targetRequest.filled_by !==
        currentUser.name
    ) {

      alert(
        "🚫 본인이 등록한 대근만 취소할 수 있습니다."
      );

      return;

    }


    /*
     * 조 관리자
     *
     * 자기 조의 대근만 취소
     */

    if (
      isTeamAdmin() &&
      targetRequest.team !==
        currentUser.team
    ) {

      alert(
        `🚫 ${currentUser.team}조 관리자입니다.\n` +
        `다른 조의 대근은 취소할 수 없습니다.`
      );

      return;

    }


    /*
     * admin은 전체 조 가능
     */

    if (
      !confirm(
        "해당 대근 내역을 취소(삭제)하시겠습니까?"
      )
    ) {

      return;

    }


    const {
      error
    } =
      await supabaseClient
        .from('requests')
        .update({

          status:
            'OPEN',

          filled_by:
            null

        })
        .eq(
          'id',
          id
        );


    if (error) {

      alert(
        "❌ 대근 취소 실패: " +
        error.message
      );

    } else {

      loadData();

    }

  }


  /*
   * ==========================================
   * 휴무 취소
   * ==========================================
   */

  async function deleteRequest(
    id,
    type
  ) {

    if (!currentUser) {

      alert(
        "로그인 후 이용해 주세요."
      );

      return;

    }


    const targetRequest =
      requestsData.find(
        r =>
          String(r.id) ===
          String(id)
      );


    if (!targetRequest) {

      alert(
        "휴무 신청 정보를 찾을 수 없습니다."
      );

      return;

    }


    /*
     * 일반 사용자:
     * 본인 휴무만 취소
     */

    if (
      currentUser.role === 'user' &&
      targetRequest.requested_by !==
        currentUser.name
    ) {

      alert(
        "🚫 본인의 휴무 신청만 취소할 수 있습니다."
      );

      return;

    }


    /*
     * 조 관리자:
     * 휴무 취소 불가
     */

    if (
      isTeamAdmin()
    ) {

      alert(
        "🚫 조 관리자 계정은 휴무 신청을 취소할 수 없습니다."
      );

      return;

    }


    /*
     * admin:
     * 모든 조 휴무 취소 가능
     */

    if (
      !confirm(
        `${type}을(를) 취소(삭제)하시겠습니까?`
      )
    ) {

      return;

    }


    const {
      error
    } =
      await supabaseClient
        .from('requests')
        .delete()
        .eq(
          'id',
          id
        );


    if (error) {

      alert(
        "❌ 삭제 실패: " +
        error.message
      );

    } else {

      loadData();

    }

  }


  /*
   * ==========================================
   * Enter 로그인
   * ==========================================
   */

  document
    .getElementById('loginCode')
    .addEventListener(
      'keydown',
      function(e) {

        if (
          e.key === 'Enter'
        ) {

          login();

        }

      }
    );

</script>
